# CPS853 Team 5 — the whole system.
# Start everything from the project folder with:   docker compose up
#
# How to add your part: put your services under your section below.
# Spark services can reuse the shared settings with   <<: *spark

name: cps853

# Shared settings for every Spark container
x-spark: &spark
  image: spark:python3
  user: root            # lets Spark write into the project folder
  working_dir: /work
  volumes:
    - ./:/work          # the project folder appears inside the container as /work

services:

  # ---------- Part 1: Store and batch (Allen) ----------

  # Raw text -> Parquet. Bad rows go to data/quarantine/ingest.
  ingest:
    <<: *spark
    command: ["/opt/spark/bin/spark-submit", "--master", "local[*]", "--driver-memory", "2g", "jobs/ingest.py"]

  # Answers Q1-Q3 from Parquet. Saves results to data/results/. Runs after ingest finishes.
  batch-queries:
    <<: *spark
    command: ["/opt/spark/bin/spark-submit", "--master", "local[*]", "--driver-memory", "2g", "jobs/batch_queries.py"]
    depends_on:
      ingest:
        condition: service_completed_successfully

  # ---------- Part 2: Stream (David) ----------
